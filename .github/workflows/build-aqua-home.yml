name: Build Aqua Home APK
# Rebuild after Kotlin source fixes

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'AquaHomeLauncher_Project.zip'
      - '.github/workflows/build-aqua-home.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o AquaHomeLauncher_Project.zip

      - name: Publish extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AquaHomeLauncher
          if ! git diff --cached --quiet; then
            git commit -m "Extract Aqua Home Android project source"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: AquaHomeLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aqua-Home-debug
          path: AquaHomeLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
